spring.application.name=user-service
server.port=5501

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8000/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===================================================================
# Database Connection Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.scmrhyygcxwnlrpcxblf}
spring.datasource.password=${DB_PASSWORD:1HP2dELbtkcOZZug}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Controls DB schema creation: "none", "validate", "update", or "create-drop"
spring.jpa.hibernate.ddl-auto=update


# Enable SQL log output for debugging (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ===================================================================
# HikariCP Connection Pool (Recommended for Supabase)
# ===================================================================
# Supabase free-tier limits maximum direct connections, so keep the pool size reasonable
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
