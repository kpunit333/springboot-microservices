spring.application.name=organization-service
server.port=5502

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8000/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===================================================================
# Database Connection Configuration (Neon PostgreSQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-green-hat-ax3pj3e9-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_06gWBVZFnzDu}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Controls DB schema creation: "none", "validate", "update", or "create-drop"
spring.jpa.hibernate.ddl-auto=update

# Enable SQL log output for debugging (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ===================================================================
# HikariCP Connection Pool (Recommended for Neon)
# ===================================================================
# Neon free-tier limits connections, so keep the pool size reasonable
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

